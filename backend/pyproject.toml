[project]
name = "backend"
version = "0.1.0"
description = "Glass drawing photo to checkable LPO: OpenCV enhancement, Claude extraction, validation flags, Excel and PDF output."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Claude API (set RUN_LIVE=1)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=7.1.1",
    "pytest>=9.2.0",
]
